name: Magnet to private R2
on:
  repository_dispatch:
    types: [magnet-to-r2]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: magnet-to-r2-production
  cancel-in-progress: false
jobs:
  transfer:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test transfer limits and selection
        run: node --test tests/magnet-to-r2.test.mjs
      - name: Transfer bounded queue batch
        timeout-minutes: 160
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SUBLYRA_ADMIN_URL: ${{ secrets.SUBLYRA_ADMIN_URL }}
          TRANSFER_BATCH_SIZE: '20'
          TRANSFER_TIMEOUT_SECONDS: '2400'
          TRANSFER_RUN_SECONDS: '9000'
          TRANSFER_MAX_BYTES: '4294967296'
          TRANSFER_DISK_RESERVE_BYTES: '2147483648'
          TRANSFER_DOWNLOAD_BPS: '8388608'
          TRANSFER_UPLOAD_BPS: '524288'
          NODE_OPTIONS: --max-old-space-size=2048
          CI: 'true'
        # Do not use --watch on ephemeral runners. Do not evaluate dispatch payloads.
        run: timeout --signal=TERM --kill-after=120s 155m node scripts/magnet-to-r2.mjs
      - name: Run summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'Transfer job: %s\nBulk mode: up to 20 films within the run budget; hourly runs continue the queue. 4 GiB per torrent, 40 minutes per film. No media or credentials saved as artifacts.\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
